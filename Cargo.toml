[package]
name = "ffmpeg-ui"
version = "0.2.2"
edition = "2024"
description = "Lightweight, integrity-verified FFmpeg GUI written in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
] }
rfd = "0.18.0"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
